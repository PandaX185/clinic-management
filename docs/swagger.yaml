basePath: /api/v1
definitions:
  api.bindStaffInput:
    properties:
      role:
        type: string
      user_id:
        type: string
    required:
    - user_id
    type: object
  api.bindStaffResponse:
    properties:
      bound:
        type: boolean
    type: object
  api.bookInput:
    properties:
      clinic_id:
        type: string
      doctor_id:
        type: string
      duration_minutes:
        type: integer
      notes:
        type: string
      start_time:
        type: string
    required:
    - clinic_id
    - doctor_id
    - start_time
    type: object
  api.cancelInput:
    properties:
      clinic_id:
        type: string
      reason:
        type: string
    required:
    - clinic_id
    - reason
    type: object
  api.clinicDetailResponse:
    properties:
      address:
        type: string
      city:
        type: string
      created_at:
        type: string
      description:
        type: string
      doctors:
        items:
          $ref: '#/definitions/api.doctorResponse'
        type: array
      email:
        type: string
      hours:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      services:
        items:
          $ref: '#/definitions/api.serviceItemResponse'
        type: array
      slug:
        type: string
    type: object
  api.clinicListItem:
    properties:
      address:
        type: string
      city:
        type: string
      created_at:
        type: string
      hours:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      slug:
        type: string
    type: object
  api.clinicResponse:
    properties:
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      slug:
        type: string
    type: object
  api.createClinicInput:
    properties:
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 63
        type: string
    required:
    - name
    - slug
    type: object
  api.createProfileInput:
    properties:
      display_name:
        maxLength: 255
        type: string
      role:
        type: string
      user_id:
        type: string
    required:
    - display_name
    - user_id
    type: object
  api.doctorResponse:
    properties:
      clinic_id:
        type: string
      clinic_name:
        type: string
      id:
        type: string
      name:
        type: string
      specialty:
        type: string
    type: object
  api.doctorsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.doctorResponse'
        type: array
      pagination:
        $ref: '#/definitions/api.pagination'
    type: object
  api.exceptionInput:
    properties:
      date:
        type: string
      end_time:
        type: string
      reason:
        type: string
      start_time:
        type: string
      type:
        enum:
        - leave
        - holiday
        - unavailable
        - extra_hours
        type: string
    required:
    - date
    - end_time
    - start_time
    - type
    type: object
  api.pagination:
    properties:
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  api.profileResponse:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      status:
        type: string
      user_id:
        type: string
    type: object
  api.profilesListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.profileResponse'
        type: array
    type: object
  api.rescheduleInput:
    properties:
      clinic_id:
        type: string
      duration_minutes:
        type: integer
      start_time:
        type: string
    required:
    - clinic_id
    - start_time
    type: object
  api.scheduleExceptionResponse:
    properties:
      date:
        type: string
      end_time:
        type: string
      id:
        type: string
      reason:
        type: string
      start_time:
        type: string
      type:
        type: string
    type: object
  api.scheduleInput:
    properties:
      weekly:
        items:
          $ref: '#/definitions/api.weeklyHourInput'
        type: array
    type: object
  api.scheduleResponse:
    properties:
      doctor_id:
        type: string
      exceptions:
        items:
          $ref: '#/definitions/api.scheduleExceptionResponse'
        type: array
      weekly:
        items:
          $ref: '#/definitions/api.weeklyHourResponse'
        type: array
    type: object
  api.serviceItemResponse:
    properties:
      duration_min:
        type: integer
      id:
        type: string
      name:
        type: string
      price:
        type: number
    type: object
  api.slotResponse:
    properties:
      appointment_type_id:
        type: string
      doctor_id:
        type: string
      end:
        type: string
      start:
        type: string
    type: object
  api.slotsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.slotResponse'
        type: array
    type: object
  api.typeInput:
    properties:
      color:
        type: string
      duration_minutes:
        type: integer
      icon:
        type: string
      name:
        maxLength: 100
        type: string
      price:
        type: string
    required:
    - duration_minutes
    - name
    type: object
  api.typeResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      duration_minutes:
        type: integer
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: string
    type: object
  api.typesListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.typeResponse'
        type: array
    type: object
  api.updateUserInput:
    properties:
      full_name:
        maxLength: 255
        type: string
      phone:
        type: string
    required:
    - full_name
    - phone
    type: object
  api.weeklyHourInput:
    properties:
      day_of_week:
        maximum: 6
        minimum: 0
        type: integer
      end_time:
        type: string
      slot_duration:
        minimum: 0
        type: integer
      start_time:
        type: string
    required:
    - end_time
    - start_time
    type: object
  api.weeklyHourResponse:
    properties:
      day_of_week:
        type: integer
      end_time:
        type: string
      is_active:
        type: boolean
      slot_duration:
        type: integer
      start_time:
        type: string
    type: object
  apperr.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  github_com_PandaX185_clinic-management_internal_booking_api.clinicsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.clinicListItem'
        type: array
      pagination:
        $ref: '#/definitions/api.pagination'
    type: object
  github_com_PandaX185_clinic-management_internal_clinic_api.clinicsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.clinicResponse'
        type: array
    type: object
  github_com_PandaX185_clinic-management_internal_identity_api.userResponse:
    properties:
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      phone:
        type: string
    type: object
  github_com_PandaX185_clinic-management_internal_portal_api.appointmentResponse:
    properties:
      appointment_type_id:
        type: string
      clinic_id:
        type: string
      clinic_name:
        type: string
      doctor_id:
        type: string
      end_time:
        type: string
      id:
        type: string
      notes:
        type: string
      patient_id:
        type: string
      start_time:
        type: string
      status:
        type: string
    type: object
  github_com_PandaX185_clinic-management_internal_portal_api.appointmentsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_portal_api.appointmentResponse'
        type: array
    type: object
  github_com_PandaX185_clinic-management_internal_portal_api.userResponse:
    properties:
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
    type: object
  github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse:
    properties:
      cancellation_reason:
        type: string
      created_at:
        type: string
      doctor_id:
        type: string
      end_time:
        type: string
      id:
        type: string
      notes:
        type: string
      patient_id:
        type: string
      start_time:
        type: string
      status:
        type: string
      version:
        type: integer
    type: object
  github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  github_com_PandaX185_clinic-management_internal_scheduling_service.BookInput:
    properties:
      doctor_id:
        type: string
      duration_minutes:
        maximum: 480
        minimum: 5
        type: integer
      notes:
        type: string
      patient_id:
        type: string
      start_time:
        type: string
    required:
    - doctor_id
    - duration_minutes
    - patient_id
    - start_time
    type: object
  github_com_PandaX185_clinic-management_internal_scheduling_service.RescheduleInput:
    properties:
      duration_minutes:
        maximum: 480
        minimum: 5
        type: integer
      start_time:
        type: string
    required:
    - duration_minutes
    - start_time
    type: object
  service.CancelInput:
    properties:
      reason:
        maxLength: 1000
        type: string
    required:
    - reason
    type: object
  service.LoginInput:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  service.RegisterInput:
    properties:
      full_name:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - full_name
    - password
    - phone
    type: object
  service.TokenPair:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  service.UserClinic:
    properties:
      clinic_id:
        type: string
      clinic_name:
        type: string
      clinic_slug:
        type: string
      role_name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Multi-tenant clinic management: auth, clinic registry, booking, and
    appointments. Except for /auth/register, /auth/login and /auth/refresh, every
    endpoint requires a JWT bearer token (BearerAuth). Tenant-scoped endpoints additionally
    require the X-Tenant-ID header (see each operation).'
  title: Clinic Management API
  version: 1.0.0
paths:
  /appointment-types:
    get:
      description: Returns the bookable services defined in the active clinic.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.typesListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List appointment types
      tags:
      - catalog
    post:
      consumes:
      - application/json
      description: Defines a new bookable service in the active clinic. Admin only.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment type
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.typeInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.typeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create appointment type
      tags:
      - catalog
  /appointment-types/{id}:
    put:
      consumes:
      - application/json
      description: Updates an existing bookable service in the active clinic. Admin
        only.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment type id
        in: path
        name: id
        required: true
        type: string
      - description: Appointment type
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.typeInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.typeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update appointment type
      tags:
      - catalog
  /appointments:
    get:
      description: Lists appointments in the active tenant with optional filters and
        pagination.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Filter by patient id
        in: query
        name: patient_id
        type: string
      - description: Filter by doctor id
        in: query
        name: doctor_id
        type: string
      - description: Filter by status
        enum:
        - scheduled
        - confirmed
        - completed
        - cancelled
        - no_show
        in: query
        name: status
        type: string
      - description: Start of time window (RFC3339)
        in: query
        name: from
        type: string
      - description: End of time window (RFC3339)
        in: query
        name: to
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Page offset
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentsListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List appointments
      tags:
      - scheduling
    post:
      consumes:
      - application/json
      description: 'Creates an appointment in the active tenant (X-Tenant-ID). Concurrency-safe
        against overlapping schedules; providing the Idempotency-Key header makes
        the request repeatable — a replayed request returns the stored response with
        an Idempotent-Replay: true header.'
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Client-generated idempotency key
        in: header
        name: Idempotency-Key
        type: string
      - description: Appointment details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_service.BookInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Book an appointment
      tags:
      - scheduling
  /appointments/{id}:
    get:
      description: Returns a single appointment by id within the active tenant.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get appointment
      tags:
      - scheduling
  /appointments/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancels an appointment in the active tenant with a required reason.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      - description: Cancellation reason
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.CancelInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel appointment
      tags:
      - scheduling
  /appointments/{id}/complete:
    post:
      description: Marks an appointment as completed. Requires the admin or staff
        role in the active tenant; patients may not perform this action.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete appointment
      tags:
      - scheduling
  /appointments/{id}/confirm:
    post:
      description: Marks an appointment as confirmed. Requires the admin or staff
        role in the active tenant; patients may not perform this action.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm appointment
      tags:
      - scheduling
  /appointments/{id}/no-show:
    post:
      description: Marks an appointment as a no-show. Requires the admin or staff
        role in the active tenant; patients may not perform this action.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark appointment as no-show
      tags:
      - scheduling
  /appointments/{id}/reschedule:
    post:
      consumes:
      - application/json
      description: Moves an appointment to a new start time and/or duration in the
        active tenant.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      - description: New timing
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_service.RescheduleInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reschedule appointment
      tags:
      - scheduling
  /auth/clinics:
    get:
      consumes:
      - application/json
      description: Returns all clinics associated with the current user, with their
        role in each.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.UserClinic'
            type: array
      security:
      - BearerAuth: []
      summary: List user's clinics
      tags:
      - identity
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user by E.164 phone number and password, returning
        JWT access and refresh tokens.
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.TokenPair'
      summary: Login with phone and password
      tags:
      - identity
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the given refresh token. The user must provide a valid
        refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - identity
  /auth/me:
    get:
      consumes:
      - application/json
      description: Returns the authenticated user's profile information.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_identity_api.userResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - identity
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new access token pair.
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.TokenPair'
      summary: Refresh access token
      tags:
      - identity
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new patient account. Public endpoint — registration
        only creates patient accounts.
      parameters:
      - description: Registration details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_identity_api.userResponse'
      summary: Register a new patient account
      tags:
      - identity
  /booking/clinics:
    get:
      description: Returns active clinics for public discovery, paginated.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_booking_api.clinicsListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      summary: List clinics
      tags:
      - booking
  /booking/clinics/{id}:
    get:
      description: Returns a clinic's public profile with its services and doctors.
      parameters:
      - description: Clinic id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.clinicDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      summary: Get clinic
      tags:
      - booking
  /booking/clinics/{id}/doctors:
    get:
      description: Returns the doctors practising at a clinic, paginated.
      parameters:
      - description: Clinic id
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.doctorsListResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      summary: List clinic doctors
      tags:
      - booking
  /booking/clinics/{id}/slots:
    get:
      description: Returns open booking windows for a doctor at a clinic on a date.
      parameters:
      - description: Clinic id
        in: path
        name: id
        required: true
        type: string
      - description: Doctor profile id
        in: query
        name: doctor_id
        required: true
        type: string
      - description: Date in YYYY-MM-DD
        in: query
        name: date
        required: true
        type: string
      - description: Appointment type id (uses clinic default when absent)
        in: query
        name: appointment_type_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.slotsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      summary: Get available slots
      tags:
      - booking
  /booking/doctors/{id}:
    get:
      description: Returns a doctor regardless of which clinic they practise at.
      parameters:
      - description: Doctor profile id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.doctorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      summary: Get doctor
      tags:
      - booking
  /clinics:
    get:
      description: Returns all active clinics. Patients may browse the full registry.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_clinic_api.clinicsListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List clinics
      tags:
      - clinics
    post:
      consumes:
      - application/json
      description: Provisions a new clinic and its tenant schema. Gated on the global
        super-admin flag (users.is_admin); no X-Tenant-ID is involved.
      parameters:
      - description: Clinic details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.createClinicInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.clinicResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create clinic
      tags:
      - clinics
  /clinics/{id}/staff:
    post:
      consumes:
      - application/json
      description: Associates a user with a clinic and assigns them a role. Requires
        the admin role in the clinic identified by X-Tenant-ID.
      parameters:
      - description: Tenant id (clinic to assign into)
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Clinic id
        in: path
        name: id
        required: true
        type: string
      - description: Staff binding
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.bindStaffInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.bindStaffResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Bind staff to clinic
      tags:
      - clinics
  /clinics/mine:
    get:
      description: Returns the clinics the current user has a membership in; an empty
        list when the user has no clinics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_clinic_api.clinicsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my clinics
      tags:
      - clinics
  /doctors:
    get:
      description: Returns all profiles holding the doctor role in the active clinic.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.profilesListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List doctors
      tags:
      - catalog
  /doctors/{id}/schedule:
    get:
      description: Returns the doctor's recurring weekly windows and one-off date
        exceptions in the active clinic.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Doctor profile id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.scheduleResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get doctor schedule
      tags:
      - catalog
    put:
      consumes:
      - application/json
      description: Replaces the doctor's recurring weekly windows in the active clinic.
        Admin only.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Doctor profile id
        in: path
        name: id
        required: true
        type: string
      - description: Weekly windows (times as HH:MM)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.scheduleInput'
      produces:
      - application/json
      responses:
        "204":
          description: Schedule updated
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace weekly schedule
      tags:
      - catalog
  /doctors/{id}/schedule/exceptions:
    post:
      consumes:
      - application/json
      description: 'Registers a one-off date override for the doctor: leave, holiday,
        unavailable (blocked hours) or extra_hours (adds a window). Admin only.'
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Doctor profile id
        in: path
        name: id
        required: true
        type: string
      - description: Date override
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.exceptionInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.scheduleExceptionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add schedule exception
      tags:
      - catalog
  /doctors/{id}/schedule/exceptions/{exception_id}:
    delete:
      description: Deletes a one-off date override. Admin only.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Doctor profile id
        in: path
        name: id
        required: true
        type: string
      - description: Schedule exception id
        in: path
        name: exception_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Exception removed
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove schedule exception
      tags:
      - catalog
  /portal/appointments:
    get:
      description: Returns the patient's appointments across every clinic they attend.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_portal_api.appointmentsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my appointments
      tags:
      - portal
    post:
      consumes:
      - application/json
      description: Books a new appointment for the patient at the given clinic. The
        patient profile is provisioned on first booking.
      parameters:
      - description: Booking details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.bookInput'
      - description: Client-generated idempotency key to make the booking repeatable
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_portal_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Book an appointment
      tags:
      - portal
  /portal/appointments/{id}:
    get:
      description: Returns one of the patient's appointments. The clinic it belongs
        to is passed explicitly.
      parameters:
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      - description: Clinic the appointment belongs to
        in: query
        name: clinic_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_portal_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my appointment
      tags:
      - portal
  /portal/appointments/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancels one of the patient's appointments in the given clinic with
        a required reason.
      parameters:
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      - description: Clinic and cancellation reason
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.cancelInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_portal_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel my appointment
      tags:
      - portal
  /portal/appointments/{id}/reschedule:
    post:
      consumes:
      - application/json
      description: Moves one of the patient's appointments to a new time in the same
        clinic.
      parameters:
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      - description: Clinic and new timing
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.rescheduleInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_portal_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reschedule my appointment
      tags:
      - portal
  /portal/me:
    get:
      description: Returns the patient's global identity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_portal_api.userResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my profile
      tags:
      - portal
    put:
      consumes:
      - application/json
      description: Updates the patient's display name and phone.
      parameters:
      - description: Identity fields
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.updateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_portal_api.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update my profile
      tags:
      - portal
  /profiles:
    get:
      description: Returns every person registered in the active clinic (X-Tenant-ID),
        with their roles.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.profilesListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List clinic profiles
      tags:
      - catalog
    post:
      consumes:
      - application/json
      description: Registers an existing user as a member of the active clinic and
        assigns them a role. Admin only.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Profile details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.createProfileInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.profileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a profile
      tags:
      - catalog
securityDefinitions:
  BearerAuth:
    description: Authenticate as `Bearer <access_token>`.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Global accounts, auth, and memberships across clinics.
  name: Identity
- description: Clinic registry and per-clinic staffing.
  name: Clinics
- description: 'Clinical catalog: profiles, doctors, services, and appointment types.'
  name: Catalog
- description: 'Appointment lifecycle: book, cancel, reschedule, and status transitions.'
  name: Scheduling
- description: Public clinic discovery and doctor slot availability.
  name: Booking
- description: 'Patient portal: the patient''s own profile and appointments.'
  name: Portal
