version: '2'
sql:
- engine: postgresql
  schema:
  - db/migrations/global/000000_extensions.up.sql
  - db/migrations/global/000001_functions.up.sql
  - db/migrations/global/000001_tenants.up.sql
  - db/migrations/global/000002_admin.up.sql
  - db/queries/tenant/schema_profiles.sql
  queries:
  - db/queries/auth
  - db/queries/appointment
  - db/queries/tenant
  gen:
    go:
      package: sqlc
      out: internal/platform/db/sqlc
      sql_package: pgx/v5
      emit_interface: true
      emit_empty_slices: true
      overrides:
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
      - db_type: date
        go_type: time.Time
      - db_type: date
        nullable: true
        go_type:
          type: time.Time
          pointer: true
      - db_type: jsonb
        go_type:
          import: encoding/json
          type: RawMessage
      - db_type: jsonb
        nullable: true
        go_type:
          import: encoding/json
          type: RawMessage
          pointer: true
      - db_type: pg_catalog.varchar
        nullable: true
        go_type:
          type: string
          pointer: true
      - db_type: pg_catalog.text
        nullable: true
        go_type:
          type: string
          pointer: true