host: localhost:8080
info:
  contact: {}
  description: 'Multi-tenant clinic management: auth, clinic registry, booking, and
    appointments. Except for /auth/register, /auth/login and /auth/refresh, every
    endpoint requires a JWT bearer token (BearerAuth). Tenant-scoped endpoints additionally
    require the X-Tenant-ID header (see each operation).'
  title: Clinic Management API
  version: 1.0.0
paths:
  /appointment-types:
    get:
      description: Returns the bookable services defined in the active clinic.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.typesListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List appointment types
      tags:
      - catalog
    post:
      consumes:
      - application/json
      description: Defines a new bookable service in the active clinic. Admin only.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment type
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.typeInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.typeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create appointment type
      tags:
      - catalog
  /appointment-types/{id}:
    put:
      consumes:
      - application/json
      description: Updates an existing bookable service in the active clinic. Admin
        only.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment type id
        in: path
        name: id
        required: true
        type: string
      - description: Appointment type
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.typeInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.typeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update appointment type
      tags:
      - catalog
  /appointments:
    get:
      description: Lists appointments in the active tenant with optional filters and
        pagination.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Filter by patient id
        in: query
        name: patient_id
        type: string
      - description: Filter by doctor id
        in: query
        name: doctor_id
        type: string
      - description: Filter by status
        enum:
        - scheduled
        - confirmed
        - completed
        - cancelled
        - no_show
        in: query
        name: status
        type: string
      - description: Start of time window (RFC3339)
        in: query
        name: from
        type: string
      - description: End of time window (RFC3339)
        in: query
        name: to
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Page offset
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentsListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List appointments
      tags:
      - scheduling
    post:
      consumes:
      - application/json
      description: 'Creates an appointment in the active tenant (X-Tenant-ID). Concurrency-safe
        against overlapping schedules; providing the Idempotency-Key header makes
        the request repeatable — a replayed request returns the stored response with
        an Idempotent-Replay: true header.'
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Client-generated idempotency key
        in: header
        name: Idempotency-Key
        type: string
      - description: Appointment details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_service.BookInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Book an appointment
      tags:
      - scheduling
  /appointments/{id}:
    get:
      description: Returns a single appointment by id within the active tenant.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get appointment
      tags:
      - scheduling
  /appointments/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancels an appointment in the active tenant with a required reason.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      - description: Cancellation reason
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/service.CancelInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel appointment
      tags:
      - scheduling
  /appointments/{id}/complete:
    post:
      description: Marks an appointment as completed. Requires the admin or staff
        role in the active tenant; patients may not perform this action.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete appointment
      tags:
      - scheduling
  /appointments/{id}/confirm:
    post:
      description: Marks an appointment as confirmed. Requires the admin or staff
        role in the active tenant; patients may not perform this action.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Appointment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_scheduling_api.appointmentResponse'
        "403":
          description: Forbidden
          schema:
