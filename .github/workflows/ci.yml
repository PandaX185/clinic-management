name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Verify sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code internal/platform/db/sqlc || \
            (echo "::error::sqlc output is stale — run 'sqlc generate' and commit" && exit 1)

      - name: Verify swagger docs are up to date
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init \
            -g main.go \
            -d "$(printf '%s' 'cmd/api,internal/booking/api,internal/catalog/api,internal/clinic/api,internal/identity/api,internal/portal/api,internal/queue/api,internal/scheduling/api')" \
            -o docs --parseInternal=true --parseDependency=true
          git diff --exit-code docs || \
            (echo "::error::swagger docs are stale — run 'make swagger' and commit" && exit 1)

      - name: Format check
        run: test -z "$(gofmt -s -l .)" || (gofmt -s -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          "$(go env GOPATH)/bin/golangci-lint" run

      # Real-Postgres integration (migrations, btree_gist exclusion invariant,
      # derived queue positions) is part of the regular test run; the Postgres
      # service container serves it. The suite creates its own throwaway
      # database, so CI never touches the dev data.
      - name: Test with race detector
        run: go test -race ./...