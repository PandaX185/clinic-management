        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.updateUserInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PandaX185_clinic-management_internal_portal_api.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update my profile
      tags:
      - portal
  /portal/queue:
    get:
      description: Returns the patient's queue entries across every clinic they attend,
        with their current position where still in the line.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.myQueueResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my queue entries
      tags:
      - portal
    post:
      consumes:
      - application/json
      description: Checks the patient into a clinic's queue. A patient profile is
        provisioned on first use.
      parameters:
      - description: Clinic to check in at
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.joinQueueInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.queueEntryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Join a clinic queue
      tags:
      - portal
  /profiles:
    get:
      description: Returns every person registered in the active clinic (X-Tenant-ID),
        with their roles.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.profilesListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List clinic profiles
      tags:
      - catalog
    post:
      consumes:
      - application/json
      description: Registers an existing user as a member of the active clinic and
        assigns them a role. Admin only.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Profile details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.createProfileInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.profileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a profile
      tags:
      - catalog
  /queue:
    get:
      description: Returns the clinic's current line (waiting/called/in_progress)
        with derived positions, ordered by priority then check-in time.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Only entries checked in on/after this date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Page offset
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.queueListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the active queue
      tags:
      - queue
    post:
      consumes:
      - application/json
      description: Adds a patient to the clinic queue. A patient may also check in
        from the portal; this endpoint is for staff over-the-counter walk-ins.
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Patient check-in
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.checkInInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.entryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Check a patient in
      tags:
      - queue
  /queue/{id}:
    patch:
      consumes:
      - application/json
      description: 'Moves an entry through the queue lifecycle: waiting -> called
        -> in_progress -> completed; waiting/called may also be skipped or cancelled.'
      parameters:
      - description: Tenant id
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Queue entry id
        in: path
        name: id
        required: true
        type: string
      - description: Target status
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.statusInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.entryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a queue entry
      tags:
      - queue
securityDefinitions:
  BearerAuth:
    description: Authenticate as `Bearer <access_token>`.
    in: header
    name: Authorization
    type: apiKey
